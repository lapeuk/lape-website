<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAPE — London Academic Prestige Experience</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07182c;
      color: white;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 900px;
    }

    .logo {
      font-size: 18px;
      letter-spacing: 5px;
      margin-bottom: 35px;
      font-weight: bold;
    }

    h1 {
      font-size: 64px;
      line-height: 1.05;
      margin-bottom: 25px;
    }

    .gold {
      color: #d8b66a;
    }

    .subtitle {
      font-size: 22px;
      line-height: 1.6;
      color: #d9e1ea;
      margin-bottom: 40px;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #d8b66a;
      color: #07182c;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">

      <div class="logo">LAPE · LONDON</div>

      <h1>
        The world is<br>
        <span class="gold">your classroom.</span>
      </h1>

      <p class="subtitle">
        London Academic Prestige Experience<br>
        Educational journeys that inspire the future.
      </p>

      <a class="button" href="#journeys">
        Discover our journeys
      </a>

    </div>
  </section>

</body>
</html>
